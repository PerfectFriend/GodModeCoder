## 📋 Parameter Cheatsheet by Content Type

| Content Type | Duration | BPM | Shift | Temp | Key | Structure |
|--------------|----------|-----|-------|------|-----|-----------|
| Jingle | 4-15s | 120-140 | 3.0 | 0.7-0.8 | Major | Minimal |
| Bed (News) | 30-60s | 90-110 | 3.0 | 0.7 | Major | Loopable |
| Bed (Talk) | 45-90s | 80-100 | 3.0 | 0.75 | Major | Loopable |
| Bed (Late) | 60-120s | 60-80 | 3.0 | 0.75 | Major/Minor | Loopable |
| Track (Pop) | 120-180s | 110-130 | 3.0 | 0.85 | Major | V-C-B-C |
| Track (Rock) | 180-240s | 120-140 | 3.0 | 0.85 | Minor | V-C-B-C |
| Track (EDM) | 180-300s | 124-128 | 3.0 | 0.9 | Minor | Intro-Build-Drop |
| Track (Ambient) | 240-600s | 40-70 | 2.5 | 0.8 | Any | Free-form |
| Track (Jazz) | 120-240s | 80-120 | 3.0 | 0.8 | Major/Minor | AABA |
| Ad | 15-30s | 100-140 | 3.0 | 0.7-0.75 | Major | Punchy |
| News Intro | 4-8s | 90-130 | 3.0 | 0.65-0.75 | Major | Stinger |
| Sweeper | 2-4s | 80-140 | 3.0 | 0.7 | Any | Transition |

