# AI Radio Preset Configurations

This file contains ready-to-use TOML configurations for different radio content types.
Copy and modify for your specific needs.

---

## 📁 Preset Categories

### 1. Jingles (Station IDs, 5-15 seconds)
```toml
# preset_jingle_morning.toml
task_type = "text2music"
caption = "short radio jingle, bright morning energy, brass fanfare, upbeat major key, catchy 3-note motif, station identification, professional broadcast quality, 5 seconds"
instrumental = true
duration = 5
bpm = 140
keyscale = "C Major"
timesignature = "4"
vocal_language = "unknown"
inference_steps = 8
seed = -1
shift = 3.0
infer_method = "ode"
config_path = "acestep-v15-turbo"
audio_format = "wav"
thinking = true
lm_temperature = 0.85
use_cot_metas = true
use_cot_caption = true
use_cot_language = true
```

