## 🚀 Usage in gen_music.py

```python
# Load preset
def load_preset(preset_name: str) -> str:
    preset_path = f"C:\\Users\\tomas\\ai-radio\\scripts\\presets\\{preset_name}.toml"
    with open(preset_path, "r", encoding="utf-8") as f:
        return f.read()

# Generate with preset + dynamic values
def generate_from_preset(preset_name: str, out_dir: str, **overrides):
    toml_str = load_preset(preset_name)
    
    # Apply overrides (duration, bpm, seed, etc.)
    for key, value in overrides.items():
        toml_str = re.sub(f'^{key} = .*$', f'{key} = {value}', toml_str, flags=re.MULTILINE)
    
    # Save temp config
    tag = str(int(time.time()))
    cfg_path = os.path.join(RADIO_ROOT, "scripts", f"gen_{preset_name}_{tag}.toml")
    with open(cfg_path, "w", encoding="utf-8") as f:
        f.write(toml_str)
    
    # Run generation...
```

