<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saint Mary Liberty Island — Login</title>
<style>
  :root {
    --bg:#0a0a1a; --bg2:#0d0d22; --panel:#14142e; --card:#1a1a34;
    --border:#2a2a50; --gold:#ffd700; --green:#4ade80; --red:#f87171;
    --blue:#60a5fa; --text:#e0e0ee; --muted:#8a8aa5;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:radial-gradient(1200px 800px at 80% -10%, #1a1a3e 0%, var(--bg) 55%);
    color:var(--text); display:flex; align-items:center; justify-content:center;
  }
  .login-form {
    max-width:360px; width:90%; margin:auto;
    background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:28px;
  }
  .login-form h1 { color:var(--gold); margin-bottom:4px; font-size:22px; text-align:center; }
  .login-form .sub { color:var(--muted); margin-bottom:20px; font-size:13px; text-align:center; }
  .login-form label { display:block; color:var(--muted); font-size:12px; margin:14px 0 6px; }
  .login-form input {
    width:100%; padding:9px 12px; border-radius:8px; border:1px solid var(--border);
    background:var(--bg2); color:var(--text); font-size:13px; margin-bottom:0;
  }
  .login-form button {
    width:100%; margin-top:20px; padding:12px; font-size:14px;
    background:linear-gradient(90deg,#b8860b,#ffd700); color:#0a0a1a;
    border:none; border-radius:8px; font-weight:700; cursor:pointer;
  }
  .login-form button:hover { filter:brightness(1.1); }
  .login-form .hint { margin-top:16px; text-align:center; font-size:12px; color:var(--muted); }
  .login-form .hint a { color:var(--blue); }
  .msg { padding:10px 12px; border-radius:8px; margin-bottom:12px; font-size:12px; display:none; }
  .msg.err { display:block; background:#2b0d12; color:var(--red); border:1px solid #4a1520; }
  .msg.ok { display:block; background:#0d2b1a; color:var(--green); border:1px solid #1a4a2a; }
  .version-badge { position:fixed; bottom:16px; right:16px; background:var(--gold); color:#0a0a1a; font-weight:700; font-size:11px; padding:2px 8px; border-radius:4px;}
  .pw-wrap { position:relative; width:100%; }
  .pw-wrap input { width:100%; padding-right:44px; }
  .pw-wrap .pw-toggle { position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--muted); cursor:pointer; font-size:16px; padding:4px; line-height:1; }
  .pw-wrap .pw-toggle:hover { color:var(--text); }
</style>
</head>
<body>
<div class="version-badge" id="dashVersion">A07</div>

<div class="login-form">
  <h1>Saint Mary Liberty Island</h1>
  <p class="sub">Enter credentials to access the Control Center</p>
  <div class="msg err" id="loginMsg"></div>
  
  <label>Username</label>
  <input type="text" id="username" autocomplete="username" placeholder="your_username" required>
  
  <label>Password</label>
  <div class="pw-wrap">
    <input type="password" id="password" autocomplete="current-password" placeholder="••••••••" required>
    <button type="button" class="pw-toggle" onclick="togglePw('password', this)" aria-label="Show password">👁️</button>
  </div>
  
  <button type="button" onclick="submitLogin()">Enter Control Center</button>
  
  <p class="hint">
    No account? <a href="/register.html">Register with invite</a> · 
    <a href="/register.html#restore">Restore from seed</a>
  </p>
</div>

<script>
function esc(s) { return String(s==null?'':s).replace(/[&<>\"']/g, function(c){ return {'&':'&','<':'<','>':'>','\"':'"',\"'\":\"'\"}[c]; }); }

async function submitLogin() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const msg = document.getElementById('loginMsg');
  const btn = document.querySelector('.login-form button');
  
  if (!username || !password) {
    msg.textContent = 'Enter username and password';
    msg.className = 'msg err';
    return;
  }
  
  btn.disabled = true;
  btn.textContent = 'Signing in...';
  
  try {
    const res = await fetch('/login', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ username, password })
    });
    const data = await res.json();
    if (res.ok && data.status === 'ok') {
      window.location.href = '/';
    } else {
      msg.textContent = data.error || 'Invalid credentials';
      msg.className = 'msg err';
    }
  } catch(e) {
    msg.textContent = 'Connection error';
    msg.className = 'msg err';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Enter Control Center';
  }
}

function togglePw(id, btn) {
  var input = document.getElementById(id);
  if (input.type === 'password') {
    input.type = 'text';
    btn.textContent = '🙈';
  } else {
    input.type = 'password';
    btn.textContent = '👁️';
  }
}

// Enter key support
document.getElementById('password').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') submitLogin();
});

document.getElementById('username').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') submitLogin();
});
</script>
</body>
</html>
