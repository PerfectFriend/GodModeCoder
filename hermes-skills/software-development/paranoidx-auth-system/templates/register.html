<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register / Restore — Saint Mary Liberty Island</title>
<style>
  :root {
    --bg:#0a0a1a; --bg2:#0d0d22; --panel:#14142e; --card:#1a1a34;
    --border:#2a2a50; --gold:#ffd700; --green:#4ade80; --red:#f87171;
    --blue:#60a5fa; --text:#e0e0ee; --muted:#8a8aa5;
    --disabled:#3a3a5a; --disabled-text:#5a5a7a;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:radial-gradient(1200px 800px at 80% -10%, #1a1a3e 0%, var(--bg) 55%);
    color:var(--text); display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:20px;
  }
  .reg-form {
    width:100%; max-width:500px; background:var(--panel);
    border:1px solid var(--border); border-radius:14px; padding:28px;
  }
  .reg-form .crest {
    width:48px; height:48px; border-radius:50%; margin:0 auto 16px;
    background:conic-gradient(from 0deg,#ffd700,#b8860b,#ffd700,#8b6914,#ffd700);
    display:flex; align-items:center; justify-content:center;
    font-size:24px; box-shadow:0 0 20px rgba(255,215,0,.4);
  }
  .reg-form h1 { color:var(--gold); text-align:center; margin-bottom:4px; font-size:22px; }
  .reg-form .sub { color:var(--muted); text-align:center; margin-bottom:20px; font-size:13px; }
  .reg-form .msg { padding:10px 12px; border-radius:8px; margin-bottom:12px; font-size:12px; display:none; }
  .reg-form .msg.err { display:block; background:#2b0d12; color:var(--red); border:1px solid #4a1520; }
  .reg-form .msg.ok { display:block; background:#0d2b1a; color:var(--green); border:1px solid #1a4a2a; }
  .reg-form label { display:block; color:var(--muted); font-size:12px; margin:14px 0 6px; }
  .reg-form input, .reg-form textarea { 
    width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--border);
    background:var(--bg2); color:var(--text); font-size:13px; margin-bottom:0; 
  }
  .reg-form input:focus, .reg-form textarea:focus { 
    outline:none; border-color:var(--blue); box-shadow:0 0 0 2px rgba(96,165,250,.2); 
  }
  .reg-form input:disabled, .reg-form textarea:disabled,
  .reg-form button:disabled {
    background:var(--disabled); color:var(--disabled-text); cursor:not-allowed; border-color:var(--disabled);
  }
  .reg-form textarea { min-height:80px; resize:vertical; font-family:monospace; }
  .reg-form button { 
    width:100%; margin-top:20px; padding:12px; font-size:14px;
    background:linear-gradient(90deg,#b8860b,#ffd700); color:#0a0a1a; border:none;
    border-radius:8px; font-weight:700; cursor:pointer; 
  }
  .reg-form button:hover:not(:disabled) { filter:brightness(1.1); }
  .reg-form .hint { margin-top:16px; text-align:center; font-size:12px; color:var(--muted); }
  .reg-form .hint a { color:var(--blue); text-decoration:none; }
  .reg-form .hint a:hover { text-decoration:underline; }
  .reg-form .tabs { display:flex; gap:4px; margin-bottom:16px; }
  .reg-form .tab { 
    flex:1; padding:10px; border-radius:8px 8px 0 0; background:var(--bg2); 
    border:1px solid var(--border); border-bottom:none; text-align:center; font-size:13px; 
    cursor:pointer; color:var(--muted); user-select:none;
  }
  .reg-form .tab:hover { color:var(--text); }
  .reg-form .tab.active { background:var(--panel); color:var(--gold); border-color:var(--gold); }
  .reg-form .panel { display:none; }
  .reg-form .panel.active { display:block; animation:fadeIn 0.2s; }
  @keyframes fadeIn { from {opacity:0;transform:translateY(4px);} to {opacity:1;transform:translateY(0);} }
  .mnemonic-words { display:flex; flex-wrap:wrap; gap:4px; margin:8px 0; }
  .mnemonic-words span { background:var(--bg2); border:1px solid var(--border); padding:4px 8px; border-radius:4px; font-family:monospace; font-size:11px; }
  .mnemonic-words span.generated { background:#1a3a1a; border-color:#1a4a2a; color:var(--green); }
  .pw-wrap { position:relative; width:100%; }
  .pw-wrap input { width:100%; padding-right:44px; }
  .pw-wrap .pw-toggle { 
    position:absolute; right:10px; top:50%; transform:translateY(-50%); 
    background:none; border:none; color:var(--muted); cursor:pointer; font-size:16px; 
    padding:4px; line-height:1; display:flex; align-items:center; justify-content:center;
    width:32px; height:32px; border-radius:6px; tabindex:-1;
  }
  .pw-wrap .pw-toggle:hover { color:var(--text); background:var(--bg); }
  .pw-wrap .pw-toggle:focus { outline:none; }
</style>
</head>
<body>
<div class="reg-form">
  <div class="crest">⚜️</div>
  <h1>Saint Mary</h1>
  <p class="sub">Liberty Island — Username Registration & Recovery</p>
  <div class="version-badge" style="text-align:right;color:#b8860b;font-family:monospace;font-size:11px;margin-bottom:8px;">A13</div>
  <div class="msg err" id="msg"></div>
  <div class="msg ok" id="msgOk"></div>
  
  <div class="tabs" role="tablist" aria-label="Registration mode">
    <div class="tab active" data-tab="register" role="tab" aria-selected="true" tabindex="0" id="tab-register">Register with Invite</div>
    <div class="tab" data-tab="restore" role="tab" aria-selected="false" tabindex="-1" id="tab-restore">Restore from Seed</div>
  </div>
  
  <!-- Register Panel -->
  <div class="panel active" id="panel-register" role="tabpanel" aria-labelledby="tab-register">
    <form id="form-register" novalidate>
      <label for="invite">Invite Token</label>
      <input type="text" id="invite" name="invite" placeholder="Enter your invite token" required autocomplete="off" spellcheck="false">
      
      <label for="username">Username (not email)</label>
      <input type="text" id="username" name="username" placeholder="your_username" required autocomplete="username" pattern="[a-zA-Z0-9_-]{3,32}" title="3-32 chars: letters, numbers, underscore, dash" spellcheck="false">
      
      <label for="password">Password (min 8 chars)</label>
      <div class="pw-wrap">
        <input type="password" id="password" name="password" placeholder="Enter password" required autocomplete="new-password" minlength="8" spellcheck="false">
        <button type="button" class="pw-toggle" data-target="password" aria-label="Show password" tabindex="-1">👁️</button>
      </div>
      
      <label for="confirm">Confirm Password</label>
      <div class="pw-wrap">
        <input type="password" id="confirm" name="confirm" placeholder="Confirm password" required autocomplete="new-password" minlength="8" spellcheck="false">
        <button type="button" class="pw-toggle" data-target="confirm" aria-label="Show password" tabindex="-1">👁️</button>
      </div>
      
      <label for="mnemonic">Seed Phrase (optional - leave empty to generate new BIP39)</label>
      <textarea id="mnemonic" name="mnemonic" placeholder="Enter existing 12 or 24-word BIP39 seed phrase to restore wallet... or leave empty to generate new" spellcheck="false"></textarea>
      <small style="color:var(--muted);font-size:11px;display:block;margin-top:4px;">If provided, this mnemonic will be validated and linked to your account for recovery.</small>
      
      <button type="submit" id="btn-register">Create Account</button>
    </form>
  </div>
  
  <!-- Restore Panel -->
  <div class="panel" id="panel-restore" role="tabpanel" aria-labelledby="tab-restore" hidden>
    <form id="form-restore" novalidate>
      <label for="restore-username">Username</label>
      <input type="text" id="restore-username" name="username" placeholder="your_username" required autocomplete="username" spellcheck="false">
      
      <label for="restore-mnemonic">Seed Phrase (12 or 24 words)</label>
      <textarea id="restore-mnemonic" name="mnemonic" placeholder="Enter your 12 or 24-word BIP39 seed phrase" required autocomplete="off" spellcheck="false"></textarea>
      
      <label for="restore-password">New Password (min 8 chars)</label>
      <div class="pw-wrap">
        <input type="password" id="restore-password" name="password" placeholder="Enter new password" required autocomplete="new-password" minlength="8" spellcheck="false">
        <button type="button" class="pw-toggle" data-target="restore-password" aria-label="Show password" tabindex="-1">👁️</button>
      </div>
      
      <label for="restore-confirm">Confirm New Password</label>
      <div class="pw-wrap">
        <input type="password" id="restore-confirm" name="confirm" placeholder="Confirm new password" required autocomplete="new-password" minlength="8" spellcheck="false">
        <button type="button" class="pw-toggle" data-target="restore-confirm" aria-label="Show password" tabindex="-1">👁️</button>
      </div>
      
      <button type="submit" id="btn-restore">Restore Account</button>
    </form>
  </div>
  
  <p class="hint">Already have an account? <a href="/login">Sign in</a></p>
</div>
<script>
'use strict';

function esc(s){ return String(s==null?'':s).replace(/[&<>\"']/g,function(c){return {'&':'&','<':'<','>':'>','"':'"',"'":"'"}[c]); }); }

function showMsg(msg, isError) {
  var e = document.getElementById(isError ? 'msg' : 'msgOk');
  var o = document.getElementById(isError ? 'msgOk' : 'msg');
  e.textContent = msg; e.style.display = 'block';
  o.style.display = 'none';
}

function clearMsg() {
  document.getElementById('msg').style.display = 'none';
  document.getElementById('msgOk').style.display = 'none';
}

// Tab switching - keyboard accessible, no focus stealing
var tabs = document.querySelectorAll('.tab');
var panels = document.querySelectorAll('.panel');

function activateTab(tabName) {
  tabs.forEach(function(t) {
    var isActive = t.dataset.tab === tabName;
    t.classList.toggle('active', isActive);
    t.setAttribute('aria-selected', isActive);
    t.tabIndex = isActive ? 0 : -1;
  });
  panels.forEach(function(p) {
    var isActive = p.id === 'panel-' + tabName;
    p.classList.toggle('active', isActive);
    p.hidden = !isActive;
  });
  clearMsg();
}

tabs.forEach(function(tab) {
  tab.addEventListener('click', function() { activateTab(this.dataset.tab); });
  tab.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activateTab(this.dataset.tab); }
    if (e.key === 'ArrowRight') { e.preventDefault(); tabs[1].focus(); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); tabs[0].focus(); }
  });
});

// Eye toggle - delegation, no inline handlers, tabindex=-1 prevents focus stealing
document.addEventListener('click', function(e) {
  var toggle = e.target.closest('.pw-toggle');
  if (!toggle) return;
  var targetId = toggle.dataset.target;
  var input = document.getElementById(targetId);
  if (!input) return;
  if (input.type === 'password') {
    input.type = 'text';
    toggle.textContent = '🙈';
    toggle.setAttribute('aria-label', 'Hide password');
  } else {
    input.type = 'password';
    toggle.textContent = '👁️';
    toggle.setAttribute('aria-label', 'Show password');
  }
});

// Register form - REAL API CALL, no form clearing on error
document.getElementById('form-register').addEventListener('submit', async function(e) {
  e.preventDefault();
  clearMsg();
  
  var invite = document.getElementById('invite').value.trim();
  var username = document.getElementById('username').value.trim();
  var pwd = document.getElementById('password').value;
  var cpwd = document.getElementById('confirm').value;
  var mnemonic = document.getElementById('mnemonic').value.trim();
  
  if (!invite || !username || !pwd) { showMsg('All fields required', true); return; }
  if (!/^[a-zA-Z0-9_-]{3,32}$/.test(username)) { showMsg('Username: 3-32 chars, letters/numbers/_- only', true); return; }
  if (pwd.length < 8) { showMsg('Password min 8 chars', true); return; }
  if (pwd !== cpwd) { showMsg('Passwords do not match', true); return; }
  if (mnemonic) {
    var words = mnemonic.split(/\s+/);
    if (words.length !== 12 && words.length !== 24) { showMsg('Mnemonic must be 12 or 24 words', true); return; }
  }
  
  var submitBtn = document.getElementById('btn-register');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Creating...';
  
  try {
    var body = {username: username, password: pwd, invite: invite};
    if (mnemonic) body.mnemonic = mnemonic;
    
    var res = await fetch('/api/auth/register-with-invite', {
      method: 'POST', credentials: 'include',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    });
    var data = await res.json().catch(function(){return {};});
    
    if (res.ok && data.status === 'created') {
      var msg = 'Account created! ';
      if (data.mnemonic) {
        msg += 'Your seed phrase: ' + data.mnemonic + ' — SAVE IT SECURELY!';
      }
      showMsg(msg, false);
      if (data.mnemonic && !mnemonic) {
        var words = data.mnemonic.split(' ');
        var html = '<div class="mnemonic-words">';
        words.forEach(function(w, i) { html += '<span class="generated">' + (i+1) + '. ' + esc(w) + '</span>'; });
        html += '</div><p style="color:var(--red);font-size:12px;margin-top:8px;"><strong>⚠️ COPY AND STORE THIS SEED PHRASE SECURELY. IT CANNOT BE RECOVERED.</strong></p>';
        document.getElementById('msgOk').innerHTML = html;
      }
      setTimeout(function(){ window.location.href = '/'; }, 3000);
    } else {
      showMsg(data.error || ('Error: ' + res.status), true);
    }
  } catch(err) { 
    showMsg(err.message, true); 
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Create Account';
  }
});

// Restore form - REAL API CALL, no form clearing on error
document.getElementById('form-restore').addEventListener('submit', async function(e) {
  e.preventDefault();
  clearMsg();
  
  var username = document.getElementById('restore-username').value.trim();
  var mnemonic = document.getElementById('restore-mnemonic').value.trim();
  var pwd = document.getElementById('restore-password').value;
  var cpwd = document.getElementById('restore-confirm').value;
  
  if (!username || !mnemonic || !pwd) { showMsg('All fields required', true); return; }
  var wordCount = mnemonic.split(/\s+/).length;
  if (wordCount !== 12 && wordCount !== 24) { showMsg('Mnemonic must be 12 or 24 words', true); return; }
  if (pwd.length < 8) { showMsg('Password min 8 chars', true); return; }
  if (pwd !== cpwd) { showMsg('Passwords do not match', true); return; }
  
  var submitBtn = document.getElementById('btn-restore');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Restoring...';
  
  try {
    var res = await fetch('/api/auth/restore', {
      method: 'POST', credentials: 'include',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: username, mnemonic: mnemonic, password: pwd})
    });
    var data = await res.json().catch(function(){return {};});
    
    if (res.ok && data.status === 'restored') {
      showMsg('Account restored and logged in! Redirecting...', false);
      setTimeout(function(){ window.location.href = '/'; }, 1500);
    } else {
      showMsg(data.error || ('Error: ' + res.status), true);
    }
  } catch(err) { showMsg(err.message, true); }
  finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Restore Account';
  }
});
</script>
</body>
</html>
