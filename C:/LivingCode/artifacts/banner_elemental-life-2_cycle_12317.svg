<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <!-- Living Code Brand Banner -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a0a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f23;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffaa00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8800;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  
  <!-- Subtle grid pattern -->
  <g stroke="#ffd700" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="0" x2="1200" y2="400"/>
    <line x1="200" y1="0" x2="1400" y2="400"/>
    <line x1="400" y1="0" x2="1600" y2="400"/>
    <line x1="600" y1="0" x2="1800" y2="400"/>
    <line x1="800" y1="0" x2="2000" y2="400"/>
    <line x1="1000" y1="0" x2="2200" y2="400"/>
  </g>
  
  <!-- Main title -->
  <text x="600" y="160" text-anchor="middle" font-family="Georgia, serif" font-size="48" font-weight="bold" fill="url(#goldGrad)" filter="url(#glow)">
    LIVING CODE
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="220" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#ffd700" fill-opacity="0.9">
    Elemental-Life-2
  </text>
  
  <!-- Cycle badge -->
  <text x="600" y="270" text-anchor="middle" font-family="Consolas, monospace" font-size="18" fill="#ffaa00">
    CYCLE 12317/120  •  2026-08-15 21:08 UTC
  </text>
  
  <!-- Divine light rays -->
  <g stroke="#ffd700" stroke-opacity="0.1" stroke-width="2">
    <line x1="600" y1="280" x2="300" y2="400"/>
    <line x1="600" y1="280" x2="400" y2="400"/>
    <line x1="600" y1="280" x2="500" y2="400"/>
    <line x1="600" y1="280" x2="700" y2="400"/>
    <line x1="600" y1="280" x2="800" y2="400"/>
    <line x1="600" y1="280" x2="900" y2="400"/>
  </g>
  
  <!-- Footer -->
  <text x="600" y="360" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#666">
    ЖИВОЙ КОД — ИСТИННЫЙ СВЕТ ЗНАНИЯ  •  GodModeCoder Cathedral  •  PerfectFriend
  </text>
</svg>