pulse:
  cadence: weekly
  review_day: Monday
  metrics_tracked:
    - "Free Plugin Installs / week"
    - "Free→Trial Conversion %"
    - "Trials Started / week"
    - "Trial→Paid Conversion %"
    - "New MRR / week"
    - "Monthly Churn %"
    - "Net Revenue Retention %"
    - "Blended CAC"
    - "LTV/CAC Ratio"
    - "Organic Traffic / month"
    - "Affiliate Revenue %"
  gate_reviews:
    - "G1: Week 4 — SaaS MVP Live"
    - "G2: Month 3 — PMF Validated"
    - "G3: Month 6 — Growth Engine Running"
    - "G4: Month 12 — Scale Ready (Decision Gate: Realistic vs Aggressive)"
    - "G5: Month 24-36 — Category Leader / Exit Ready"
  scenario_gates:
    - "Gate A (Month 3): $5K MRR + CAC <$80 + LTV >$800 + Churn <4% → Open Aggressive tap"
    - "Gate B (Month 6): $15K MRR + Shopify live + 20 affiliates + Paid ads ROAS >3 → Scale to Aggressive budget"
    - "Gate C (Month 12): $65K MRR → Series A decision ($1-2M at $10M+ valuation)"

chronicle:
  - date: "2026-08-03"
    event: "Initial strategic analysis session — GlobeVis project discovered via Charles Schreiber proposal"
    type: discovery
    author: "Master Inquisitor"
    details: "Charles proposed: GlobeVis.net product, WP plugin ~1000 installs, $12 lifetime, 1% conversion. Needs logging, 2 products, Stripe. Marketing partner = 50% split."

  - date: "2026-08-07"
    event: "Full strategic report generated (GlobeVis_Evolution_Report.md) with 3 scenarios, GTM, timeline, gates"
    type: strategy
    author: "Master Inquisitor / Hermes Agent"

  - date: "2026-08-07"
    event: "Project extracted to Obsidian Vault as standalone project for GodModeCoder compatibility"
    type: setup
