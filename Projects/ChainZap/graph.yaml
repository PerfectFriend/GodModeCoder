pulse:
  cadence: weekly
  review_day: Monday
  metrics_tracked:
    - "MAU / DAU"
    - "Daily Checks"
    - "Pro Subscribers / MRR"
    - "API Calls/day"
    - "Integrations count"
    - "Milestone progress"
    - "Code velocity (Hermes)"
    - "Infrastructure cost"
  gate_reviews:
